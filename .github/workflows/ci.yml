name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: true
      CLOUDFLARE_REMOTE_BINDINGS: 'false'
      VITE_GAME_MODE: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: |
          pnpm format:check
          pnpm exec prettier --check .github/workflows/ci.yml pnpm-workspace.yaml
      - name: Test rules and adapters
        run: pnpm test
      - name: Build browser and Worker bundles
        run: pnpm build
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
      - name: Test isolated database
        env:
          POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: pnpm test:db
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test local browser flows
        run: pnpm test:e2e --workers=2
      - name: Test cloud browser flows with mocked services
        run: |
          pnpm test:cloud
          E2E_GOOGLE_AUTH_ENABLED=false pnpm test:cloud --grep 'Google availability follows deployment settings'
      - name: Build production bundles with deployment settings
        if: github.repository == 'kotek-7/mogubiyori' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VITE_GAME_MODE: ${{ vars.VITE_GAME_MODE || 'local' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_AUTH_ENABLED: ${{ vars.VITE_GOOGLE_AUTH_ENABLED || 'false' }}
        run: |
          case "$VITE_GAME_MODE" in
            local) ;;
            cloud)
              if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
                echo '::error::Cloud publishing requires VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY repository variables.'
                exit 1
              fi
              ;;
            *)
              echo '::error::VITE_GAME_MODE must be local or cloud.'
              exit 1
              ;;
          esac
          pnpm build
      - name: Save verified production bundles
        if: github.repository == 'kotek-7/mogubiyori' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: production-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: validate
    if: github.repository == 'kotek-7/mogubiyori' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://mogubiyori.kotek7.com
    concurrency:
      group: mogubiyori-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified production bundles
        uses: actions/download-artifact@v8
        with:
          name: production-bundles
          path: dist/
      - name: Check current main before publishing
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'main has advanced; its newer workflow will publish.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy to Cloudflare Workers
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable.'
            exit 1
          fi
          pnpm exec wrangler deploy --config dist/mogubiyori/wrangler.json \
            --tag "git-${GITHUB_SHA:0:7}" --message "GitHub Actions $GITHUB_RUN_ID: $GITHUB_SHA"
      - name: Verify production response
        if: steps.revision.outputs.current == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            --max-time 30 https://mogubiyori.kotek7.com/ --output "$RUNNER_TEMP/production.html"
          cmp dist/client/index.html "$RUNNER_TEMP/production.html"
          status=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            --max-time 30 --output "$RUNNER_TEMP/recognition.json" --write-out '%{http_code}' \
            https://mogubiyori.kotek7.com/api/recognize-food)
          test "$status" = 405
          echo "Published $GITHUB_SHA to https://mogubiyori.kotek7.com/" >> "$GITHUB_STEP_SUMMARY"
